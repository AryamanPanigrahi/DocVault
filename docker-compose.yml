services:
  postgres:
    image: postgres:16
    container_name: docvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: docvault
      POSTGRES_PASSWORD: docvault_dev_password
      POSTGRES_DB: docvault
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: